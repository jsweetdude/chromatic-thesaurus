<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chromatic Thesaurus</title>
<meta name="description" content="A zoomable map of color vocabulary for writers: hue left to right, lightness up and down, with a detail card and a photograph for every word.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     TOKENS — A11y Context design system (dark is this page's default,
     because a spectrum reads best on a dark canvas). Spec:
     03 - Context/Personal/Design-System/a11y-context-design-system.md
     ============================================================ */
  :root, :root[data-theme="light"]{
    --bg:#F5F6F8; --surface:#FFFFFF; --ink:#0E1116; --muted:#5A6270;
    --border:#E2E4E8; --field-bg:#FBFBFC;
    --accent:#5B3FD6; --accent-hover:#4E36C0; --accent-soft:#ECEAFB; --link:#4A34B8;
    --shadow-card:0 1px 2px rgba(14,17,22,.04);
    --focus-ring:0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0D1117; --surface:#161B22; --ink:#E8EBF0; --muted:#8B95A3;
    --border:#262C36; --field-bg:#0F141B;
    --accent:#9C82F5; --accent-hover:#B9A6FA; --accent-soft:#23203A; --link:#B9A6FA;
    --shadow-card:0 1px 2px rgba(0,0,0,.30);
    --focus-ring:0 0 0 2px var(--accent), 0 0 0 4px var(--bg);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1117; --surface:#161B22; --ink:#E8EBF0; --muted:#8B95A3;
      --border:#262C36; --field-bg:#0F141B;
      --accent:#9C82F5; --accent-hover:#B9A6FA; --accent-soft:#23203A; --link:#B9A6FA;
      --shadow-card:0 1px 2px rgba(0,0,0,.30);
      --focus-ring:0 0 0 2px var(--accent), 0 0 0 4px var(--bg);
      color-scheme:dark;
    }
  }
  :root{
    --display:'Schibsted Grotesk',system-ui,sans-serif;
    --body:'Hanken Grotesk',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:999px;
    --nav-h:56px;
  }

  /* ============================================================
     BASE
     ============================================================ */
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  @supports (height: 100dvh){ html,body{height:100dvh;} }
  html{background:var(--bg);}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
       display:flex;flex-direction:column;overflow:hidden;
       transition:background-color .25s ease,color .25s ease;}
  button{font:inherit;color:inherit;}

  /* Surface-aware double ring, :focus-visible only. The transparent outline
     survives Windows High Contrast Mode, where box-shadow is dropped. */
  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid transparent; outline-offset:2px;
    box-shadow:var(--focus-ring); border-radius:var(--r-sm);
  }
  .search:focus-within{outline:2px solid transparent;outline-offset:2px;box-shadow:var(--focus-ring);}
  .search input:focus-visible{outline:none;box-shadow:none;}
  @media (forced-colors: active){
    a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid;outline-offset:1px;}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important;scroll-behavior:auto !important;}
  }
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

  /* ============================================================
     NAVBAR — frosted surface, 1px hairline, no drop shadow
     ============================================================ */
  .navbar{flex:none;height:var(--nav-h);display:flex;align-items:center;gap:10px;padding:0 16px;
          border-bottom:1px solid var(--border);
          background:color-mix(in srgb, var(--surface) 92%, transparent);
          -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:5;}
  .brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;}
  .brand-mark{width:22px;height:22px;border-radius:50%;flex:none;
              background:conic-gradient(from 0deg,#e0115f,#ff2400,#ffbf00,#7fff00,#008080,#0047ab,#8f00ff,#ff00ff,#e0115f);
              box-shadow:inset 0 0 0 5px var(--surface);}
  .brand-word{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;}
  .pill{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--border);
        border-radius:var(--r-pill);padding:1px 9px;white-space:nowrap;}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;}

  .search{position:relative;display:flex;align-items:center;gap:8px;width:230px;
          background:var(--field-bg);border:1px solid var(--border);border-radius:var(--r-md);padding:6px 10px;}
  .search svg{width:15px;height:15px;color:var(--muted);flex:none;}
  .search input{flex:1;min-width:0;border:none;background:transparent;color:var(--ink);font-family:var(--body);font-size:13.5px;}
  .search input::placeholder{color:var(--muted);}
  .search .count{font-size:12px;color:var(--muted);white-space:nowrap;}

  .tbtn{display:inline-flex;align-items:center;gap:6px;font-family:var(--body);font-size:12.5px;font-weight:600;
        line-height:1;color:var(--ink);background:transparent;border:1px solid var(--border);
        border-radius:var(--r-sm);padding:7px 10px;cursor:pointer;white-space:nowrap;
        transition:background-color .15s ease,border-color .15s ease,color .15s ease;}
  .tbtn:hover{background:var(--field-bg);border-color:var(--accent);}
  .tbtn[aria-pressed="true"]{color:var(--link);border-color:var(--accent);background:var(--accent-soft);}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
            border:none;background:transparent;color:var(--muted);border-radius:var(--r-md);cursor:pointer;}
  .icon-btn:hover{background:var(--field-bg);color:var(--ink);}
  .icon-btn svg{width:19px;height:19px;}

  /* ============================================================
     MAP
     ============================================================ */
  main{flex:1;display:flex;min-height:0;}
  #stage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;outline:none;min-width:0;}
  #stage.dragging{cursor:grabbing;}
  #stage:focus-visible{box-shadow:inset 0 0 0 2px var(--accent);border-radius:0;}
  #band{position:absolute;inset:0;width:100%;height:100%;}
  #headers{position:absolute;top:0;left:0;right:0;height:48px;pointer-events:none;overflow:hidden;}
  .hdr{position:absolute;top:10px;left:0;transform:translateX(-50%);text-align:center;
       font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;}
  .hdr::after{content:'';display:block;width:1px;height:9px;margin:3px auto 0;background:var(--muted);}
  .axis{position:absolute;left:12px;font-size:12px;font-weight:600;color:var(--muted);pointer-events:none;
        text-transform:uppercase;letter-spacing:.08em;}
  .axis.top{top:56px;} .axis.bottom{bottom:14px;}
  #layer{position:absolute;inset:0;}

  .dot{position:absolute;left:0;top:0;z-index:1;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
       background:var(--c);box-shadow:0 0 0 1.5px var(--bg);will-change:transform;transition:opacity .15s ease;}
  .dot.neutral{border-radius:2px;}
  .lbl{position:absolute;left:0;top:0;z-index:2;display:inline-flex;align-items:center;gap:6px;will-change:transform;
       font-family:var(--body);font-weight:500;font-size:13px;line-height:1.3;color:var(--ink);
       background:color-mix(in srgb, var(--surface) 95%, transparent);border:1px solid var(--border);
       border-radius:var(--r-sm);padding:2px 8px 2px 6px;cursor:pointer;white-space:nowrap;
       transition:opacity .18s ease,border-color .15s ease;}
  .lbl.t1{font-size:15px;font-weight:600;}
  .lbl.t3{font-size:12px;font-weight:400;}
  .lbl .sw{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none;box-shadow:0 0 0 1px var(--border);}
  .lbl:hover{border-color:var(--accent);}
  .lbl.hidden{opacity:0;pointer-events:none;}
  /* Pinned = accent border + underline. Two cues, never color alone. */
  .lbl.pinned{border-color:var(--accent);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;}
  .lbl.hit{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
  .lbl.hit:focus-visible{box-shadow:var(--focus-ring), inset 0 0 0 1px var(--accent);}
  .dot.dim, .lbl.dim{opacity:.18;}
  .lbl.dim.hidden{opacity:0;}

  .zoomctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;}
  .zoomctl .tbtn{width:34px;height:34px;justify-content:center;padding:0;font-size:16px;background:var(--surface);}

  /* ============================================================
     PANEL
     ============================================================ */
  #panel{flex:none;width:350px;border-left:1px solid var(--border);background:var(--surface);
         overflow-y:auto;padding:22px 22px 30px;}
  .eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--link);margin-bottom:8px;}
  #panel h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.12;letter-spacing:-.01em;
            margin-bottom:12px;text-wrap:balance;}
  .swatch{height:92px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--c);
          display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;}
  .swatch code, .lch{font-family:var(--mono);font-size:12px;background:var(--surface);color:var(--ink);
          border:1px solid var(--border);border-radius:var(--r-sm);padding:.15em .5em;}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted);}
  .approx{font-size:12.5px;color:var(--muted);margin-top:8px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--r-sm);}
  .def{font-size:15.5px;line-height:1.55;margin:16px 0 4px;}
  .sec{margin-top:18px;}
  .sec-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:7px;}
  .sec p{font-size:14.5px;line-height:1.55;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-family:var(--body);font-size:12.5px;font-weight:600;color:var(--ink);background:var(--field-bg);
        border:1px solid var(--border);border-radius:var(--r-pill);padding:3px 11px;cursor:pointer;}
  .chip:hover{border-color:var(--accent);}
  .chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--link);border-color:var(--accent);}
  .photo{margin-top:10px;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;
         background:var(--field-bg);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
         color:var(--muted);font-size:13px;text-align:center;padding:12px;}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo.loaded{padding:0;}
  .cap{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .cap a{color:var(--link);text-decoration:underline;text-underline-offset:2px;}
  .nb{list-style:none;display:flex;flex-direction:column;gap:6px;}
  .nb button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;
             border:1px solid var(--border);border-radius:var(--r-md);padding:6px 9px;color:var(--ink);
             font-family:var(--body);font-size:13.5px;font-weight:500;cursor:pointer;}
  .nb button:hover{border-color:var(--accent);background:var(--field-bg);}
  .nb .sq{width:22px;height:22px;border-radius:var(--r-sm);flex:none;border:1px solid var(--border);background:var(--c);}
  .nb .rel{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400;text-align:right;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
  .badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;
         letter-spacing:.05em;border-radius:var(--r-pill);padding:2px 9px;background:var(--accent-soft);color:var(--link);}
  .legend p{font-size:14.5px;color:var(--muted);line-height:1.55;margin-bottom:12px;}
  .legend p strong{color:var(--ink);font-weight:600;}
  .legend kbd{font-family:var(--body);font-size:12px;border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--ink);background:var(--field-bg);}
  .legend .stat{font-size:13px;color:var(--muted);margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}

  @media (max-width: 900px){
    main{flex-direction:column;}
    #panel{width:auto;height:44vh;border-left:none;border-top:1px solid var(--border);padding:18px 16px 24px;}
    .search{width:150px;}
    .pill, .nav-right .hide-sm{display:none;}
    .navbar{gap:8px;padding:0 12px;}
    .axis{font-size:11px;} .axis.top{top:52px;} .axis.bottom{bottom:10px;}
  }
  /* phones: the toolbar wraps to a second row instead of overflowing */
  @media (max-width: 640px){
    .navbar{flex-wrap:wrap;height:auto;padding:8px 12px;row-gap:6px;}
    .nav-right{flex:1 1 100%;margin-left:0;gap:6px;}
    .search{flex:1 1 120px;width:auto;min-width:0;}
    .hdr{font-size:13px;}
    .zoomctl{bottom:36px;}
  }
</style>
</head>
<body>
<header class="navbar">
  <a class="brand" href="#stage">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-word">Chromatic Thesaurus</span>
  </a>
  <span class="pill" id="countPill">…</span>

  <div class="nav-right">
    <div class="search" role="search">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.6"/>
        <path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input id="q" type="text" placeholder="Find a word: glaucous, umber…" autocomplete="off"
             aria-label="Find a color word" aria-describedby="qHelp">
      <span class="count" id="qCount" aria-live="polite"></span>
    </div>
    <span id="qHelp" class="sr-only">Type to highlight matching words. Press Enter to jump to the first match. Escape clears the search.</span>
    <button class="tbtn hide-sm" id="allBtn" type="button" aria-pressed="false" title="Show every label, even where they overlap">All labels</button>
    <button class="tbtn hide-sm" id="hypBtn" type="button" aria-pressed="false" title="Only words tagged hyperion" hidden>Hyperion</button>
    <button class="tbtn" id="resetBtn" type="button">Reset view</button>
    <button id="themeBtn" class="icon-btn" type="button" aria-pressed="true">
      <span class="sr-only">Dark theme</span>
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 13.2A8.2 8.2 0 0 1 10.8 4a8.4 8.4 0 1 0 9.2 9.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <div id="stage" tabindex="0" role="group"
       aria-label="Color map. Drag to pan, scroll to zoom. With the map focused: arrow keys pan, plus and minus zoom, zero resets. Tab moves through the visible words.">
    <canvas id="band" aria-hidden="true"></canvas>
    <div id="headers" aria-hidden="true"></div>
    <span class="axis top" aria-hidden="true">Paler than the pure hue</span>
    <span class="axis bottom" aria-hidden="true">Deeper than the pure hue</span>
    <div id="layer"></div>
    <div class="zoomctl">
      <button class="tbtn" id="zoomIn" type="button" aria-label="Zoom in">+</button>
      <button class="tbtn" id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
    </div>
  </div>
  <aside id="panel" aria-label="Word detail">
    <div id="panelBody"></div>
  </aside>
</main>

<script>
/* ==========================================================================
   THE WORD LIST — edit here.
   Each entry:
     n     the word, as you would write it
     hex   the swatch. Position on the map is COMPUTED from this value, so the
           swatch is the fact and the placement follows. Values follow the
           common web conventions (Wikipedia / X11) where one exists.
     t     tier: 1 shows at the widest zoom, 2 appears sooner, 3 only close in
     def   one sentence: what the color is and how it differs from its neighbors
     obj   real things that are this color: [label, Wikipedia article title]
           or [label, article, "File:name.jpg"] to pin a specific photo from
           that article. Without a pin the card shows the article's lead image.
           The first object is the default. Pins come from the photo audit in
           the Chromatic-Thesaurus project folder, which scores every image on
           the article by how much of the word's color it contains.
     ev    what the color evokes on the page
     or    where the word comes from
     approx  true when no conventional value exists and the swatch is a best guess
     neutral true to force the word onto the gray strip (whites, grays, blacks)
     tags    e.g. ["hyperion"] — flip as you meet the word in the book
     found   optional note: where you met it ("Hyperion, ch. 1")
   ========================================================================== */
const WORDS = [
  /* ---------------- reds and pinks ---------------- */
  {n:"Scarlet", hex:"#FF2400", t:1,
   def:"A brilliant red with a breath of orange in it; the loudest of the reds, and the one that reads as pure red from across a room.",
   obj:[["Red poppy","Papaver rhoeas"],["Northern cardinal","Northern cardinal"],["British red coat","Red coat (military uniform)"]],
   ev:"Sin, pageantry, alarm; uniforms and letters.",
   or:"From scarlata, a fine medieval cloth (probably Persian saqirlāt); the dyed fabric gave its name to the color."},
  {n:"Vermilion", hex:"#E34234", t:1,
   def:"A fiery red-orange, the color of ground cinnabar; hotter than scarlet and with none of crimson's blue.",
   obj:[["Torii gate","Torii","File:Fushimi Inari1.JPG"],["Cinnabar","Cinnabar"],["Red lacquerware","Lacquerware","File:Box with two phoenix birds and chrysanthemums, China, Ming dynasty, Yongle period, 1403-1424 AD, lacquer - Östasiatiska museet, Stockholm - DSC09540.JPG"]],
   ev:"Heat, ceremony, sacred thresholds.",
   or:"Latin vermiculus, little worm: the kermes insect used for red dye lent its name to the pigment."},
  {n:"Crimson", hex:"#DC143C", t:1,
   def:"A deep, rich red that leans toward blue and purple; scarlet's serious older sibling.",
   obj:[["Pomegranate","Pomegranate"],["Red velvet","Velvet","File:Morris and Co Acorn embossed velvet 1912.jpg"],["Kermes insect","Kermes (dye)","File:Kermes - Neve Tzuf.jpg"]],
   ev:"Passion, royalty, blood; rich rather than alarming.",
   or:"From kermes, the insect dye, through Arabic qirmiz and Old Spanish cremesín."},
  {n:"Carmine", hex:"#960018", t:2,
   def:"A deep, slightly purplish red made from cochineal; darker and more solemn than crimson.",
   obj:[["Cochineal","Cochineal","File:Slit tapestry shirt fragment, Peru, Chancay, central coast, c. 1000-1470 AD, alpaca wool dyed with saffron, cochineal, and indigo - Krannert Art Museum, UIUC - DSC06400.jpg"],["Carmine pigment","Carmine","File:Slit tapestry shirt fragment, Peru, Chancay, central coast, c. 1000-1470 AD, alpaca wool dyed with saffron, cochineal, and indigo - Krannert Art Museum, UIUC - DSC06400.jpg"],["Lipstick","Lipstick"]],
   ev:"Luxury, devotion, the theatrical.",
   or:"Medieval Latin carminium, blending Arabic qirmiz (kermes) with Latin minium (red lead)."},
  {n:"Cardinal", hex:"#C41E3A", t:3,
   def:"The vivid red of a cardinal's cassock, sitting between scarlet and crimson.",
   obj:[["Cardinal's cassock","Cardinal (Catholic Church)","File:A Cardinal in Profile, 1880, by Jehan Georges Vibert (Morgan Library and Museum, New York City).jpg"],["Northern cardinal","Northern cardinal"]],
   ev:"Office, hierarchy, ceremonial power.",
   or:"Named for the vestments of Roman Catholic cardinals; the bird was named after the churchmen."},
  {n:"Ruby", hex:"#E0115F", t:2,
   def:"The red of the gemstone, tilted toward pink and magenta; jewel-bright and cool.",
   obj:[["Ruby","Ruby","File:Cut Ruby.jpg"],["Ruby slippers","Ruby slippers"],["Pomegranate seeds","Pomegranate"]],
   ev:"Treasure, glamour, the precious.",
   or:"Latin rubeus, red; the stone named the color."},
  {n:"Cerise", hex:"#DE3163", t:3,
   def:"A deep pinkish red, the color of ripe cherries; brighter and pinker than crimson.",
   obj:[["Cherry","Cherry"],["Raspberry","Raspberry"]],
   ev:"Sweetness, flirtation, mid-century lipstick.",
   or:"French cerise, cherry."},
  {n:"Raspberry", hex:"#E30B5C", t:3,
   def:"A bright pinkish red with a hint of blue, sharper and cooler than cerise.",
   obj:[["Raspberry","Raspberry"],["Sorbet","Sorbet"]],
   ev:"Tartness, summer, the playful.",
   or:"The fruit."},
  {n:"Rose", hex:"#FF007F", t:2,
   def:"The pure hue halfway between red and magenta; every softer pink is a tint of this.",
   obj:[["Rose","Rose"],["Bougainvillea","Bougainvillea"]],
   ev:"Romance, the floral, the emphatic pink.",
   or:"The flower; Latin rosa."},
  {n:"Blush", hex:"#DE5D83", t:3,
   def:"A rosy pink with body to it, deeper than pastel; the pink of a cheek that has been noticed.",
   obj:[["Rouge","Rouge (cosmetics)","File:Bengali Hindu wedding DSCN1106 02.jpg"],["Rosé wine","Rosé"]],
   ev:"Modesty, exposure, the intimate.",
   or:"Old English blyscan, to glow red."},
  {n:"Puce", hex:"#CC8899", t:2,
   def:"A dusty, brownish pink-purple; a court color of the 1770s, named, unforgettably, for the flea.",
   obj:[["Flea","Flea"],["Marie Antoinette","Marie Antoinette"]],
   ev:"Faded elegance, powder rooms, the slightly ridiculous.",
   or:"French puce, flea."},

    const lean = near[0].d > 9 ? 'leaning ' + near[1].n.toLowerCase() : '';
    w.desc = [w.family.toLowerCase(), lean, lightWord(w.dL), chromaWord(w.C)].filter(Boolean).join(', ');
    w.eyebrow = [w.family, lean, lightWord(w.dL), chromaWord(w.C)].filter(Boolean).join(' · ');
  }
});

/* nearest neighbors in OKLab, with a plain-words relation for each */
function relation(a, b){
  const out = [];
  const dL = b.L - a.L;
  if (dL > 0.05) out.push('paler'); else if (dL < -0.05) out.push('deeper');
  const dC = b.C - a.C;
  if (dC > 0.03) out.push('more vivid'); else if (dC < -0.03) out.push('more muted');
  if (!a.isNeutral && !b.isNeutral){
    let dh = ((b.hue - a.hue) % 360 + 540) % 360 - 180;
    if (Math.abs(dh) > 6){ const t = towardName(a.hue, Math.sign(dh)); if (t) out.push('toward ' + t); }
  }
  return out.length ? out.join(' · ') : 'very close';
}
WORDS.forEach(w => {
  w.near = WORDS.filter(o => o !== w)
    .map(o => ({ w:o, d: Math.hypot(o.L - w.L, o.a - w.a, o.b - w.b) }))
    .sort((p,q) => p.d - q.d).slice(0, 3).map(p => p.w);
});

/* ---------- DOM ---------- */
const stage = $('#stage'), canvas = $('#band'), ctx = canvas.getContext('2d');
const layer = $('#layer'), headersEl = $('#headers');
const view = { s: 1, tx: 0, ty: 0 };
let fitScale = 1, showAll = false, hypOnly = false;
let pinned = null, hovered = null, hits = new Set(), searching = false;

const hdrEls = HDRS.map(h => { const e = el('div', 'hdr', esc(h.n)); headersEl.append(e); return {e, x: hueToX(h.h) * W}; });
hdrEls.push({ e: (() => { const e = el('div','hdr','Neutrals'); headersEl.append(e); return e; })(), x: STRIP_X + STRIP_W/2 });

WORDS.slice().sort((a,b) => a.x - b.x || a.y - b.y).forEach(w => {
  const dot = el('span', 'dot' + (w.isNeutral ? ' neutral' : ''));
  dot.style.setProperty('--c', w.hex); dot.title = w.n; dot.dataset.id = w.id;
  const lbl = el('button', 'lbl t' + w.t, '<span class="sw" aria-hidden="true"></span>' + esc(w.n));
  lbl.type = 'button'; lbl.style.setProperty('--c', w.hex); lbl.dataset.id = w.id;
  lbl.setAttribute('aria-label', w.n + ': ' + w.desc);
  lbl.setAttribute('aria-pressed', 'false');
  layer.append(dot, lbl);
  w.dotEl = dot; w.lblEl = lbl; w.pos = 'r';
});
function measure(){ WORDS.forEach(w => { w.lw = w.lblEl.offsetWidth; w.lh = w.lblEl.offsetHeight; }); }
measure();

/* ---------- rendering ---------- */
let raf = 0;
function requestRender(){ if (!raf) raf = requestAnimationFrame(render); }
function stageSize(){ return { w: stage.clientWidth, h: stage.clientHeight }; }

function fitView(){
  const {w,h} = stageSize();
  fitScale = Math.max(0.05, (w - 56) / WORLD_W);
  view.s = fitScale; view.tx = 28; view.ty = Math.round(h * 0.54);
  requestRender();
}

function labelRect(w, pos){
  const g = 7;
  switch (pos){
    case 'l': return { x: w.sx - g - w.lw, y: w.sy - w.lh/2, w: w.lw, h: w.lh };
    case 'a': return { x: w.sx - w.lw/2, y: w.sy - g - w.lh, w: w.lw, h: w.lh };
    case 'b': return { x: w.sx - w.lw/2, y: w.sy + g, w: w.lw, h: w.lh };
    default:  return { x: w.sx + g, y: w.sy - w.lh/2, w: w.lw, h: w.lh };
  }
}
function positionLabel(w){ const r = labelRect(w, w.pos); w.lblEl.style.transform = `translate(${r.x}px,${r.y}px)`; }

function render(){
  raf = 0;
  const {w,h} = stageSize();
  drawBand(w, h);
  // headers slide with the map; when two would overlap, the one to the right yields
  let lastRight = -Infinity;
  hdrEls.forEach(hd => {
    const x = hd.x * view.s + view.tx;
    hd.w = hd.w || hd.e.offsetWidth; const half = hd.w / 2;
    hd.e.style.left = x + 'px';
    const vis = x + half > 0 && x - half < w && x - half > lastRight + 10;
    hd.e.style.opacity = vis ? '1' : '0';
    if (vis) lastRight = x + half;
  });
  WORDS.forEach(wd => {
    wd.sx = wd.x * view.s + view.tx; wd.sy = wd.y * view.s + view.ty;
    wd.dotEl.style.transform = `translate(${wd.sx}px,${wd.sy}px)`;
    positionLabel(wd);
  });
  scheduleCollide();
}

let off = null;
function drawBand(w, h){
  const dpr = window.devicePixelRatio || 1;
  const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
  if (canvas.width !== pw || canvas.height !== ph){ canvas.width = pw; canvas.height = ph; canvas.style.width = w + 'px'; canvas.style.height = h + 'px'; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0D1117';
  const border = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#262C36';
  const yb = view.ty;
  const halo = 0.5 * V * view.s;

  // the spectrum band and its faint halo (paler above, deeper below)
  const x0 = Math.max(0, view.tx), x1 = Math.min(w, W * view.s + view.tx);
  const cols = Math.ceil(x1 - x0);
  if (cols > 0){
    if (!off) off = document.createElement('canvas');
    off.width = cols; off.height = 1;
    const img = off.getContext('2d').createImageData(cols, 1);
    for (let i = 0; i < cols; i++){
      const hue = xToHue(((x0 + i) - view.tx) / view.s / W);
      const [r,g,b] = hslToRgb(hue, 1, .5);
      img.data[i*4] = r; img.data[i*4+1] = g; img.data[i*4+2] = b; img.data[i*4+3] = 255;
    }
    off.getContext('2d').putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = 0.17;
    ctx.drawImage(off, 0, 0, cols, 1, x0, yb - halo, cols, 2 * halo);
    ctx.globalAlpha = 1;
    const fade = ctx.createLinearGradient(0, yb - halo, 0, yb + halo);
    fade.addColorStop(0, bg); fade.addColorStop(0.44, withAlpha(bg, 0)); fade.addColorStop(0.56, withAlpha(bg, 0)); fade.addColorStop(1, bg);
    ctx.fillStyle = fade; ctx.fillRect(x0, yb - halo, cols, 2 * halo);
    // whiten the tint side a little, darken the shade side, so the axis reads without labels
    const tint = ctx.createLinearGradient(0, yb - halo, 0, yb); tint.addColorStop(0, 'rgba(255,255,255,0.10)'); tint.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = tint; ctx.fillRect(x0, yb - halo, cols, halo);
    const shade = ctx.createLinearGradient(0, yb, 0, yb + halo); shade.addColorStop(0, 'rgba(0,0,0,0)'); shade.addColorStop(1, 'rgba(0,0,0,0.22)');
    ctx.fillStyle = shade; ctx.fillRect(x0, yb, cols, halo);
    ctx.drawImage(off, 0, 0, cols, 1, x0, yb - BAND_H/2, cols, BAND_H);
  }

  // the neutral strip: white at the top, black at the bottom
  const sx = STRIP_X * view.s + view.tx, sw = STRIP_W * view.s;
  if (sx < w && sx + sw > 0){
    const top = yb - halo, bot = yb + halo;
    const g2 = ctx.createLinearGradient(0, top, 0, bot); g2.addColorStop(0, '#FFFFFF'); g2.addColorStop(1, '#000000');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.roundRect(sx, top, sw, bot - top, Math.min(8, sw/3)); ctx.fill();
    ctx.strokeStyle = border; ctx.lineWidth = 1; ctx.stroke();
  }
}

/* ---------- label placement: tier gates, then greedy collision ---------- */
let collideTimer = 0;
function scheduleCollide(){ clearTimeout(collideTimer); collideTimer = setTimeout(collide, 70); }
const overlap = (a, b, pad) => a.x < b.x + b.w + pad && a.x + a.w + pad > b.x && a.y < b.y + b.h + pad && a.y + a.h + pad > b.y;
const forced = w => (w === pinned || hits.has(w)) ? 1 : 0;
function show(w){ w.lblEl.classList.remove('hidden'); w.lblEl.tabIndex = 0; }
function hide(w){ w.lblEl.classList.add('hidden'); w.lblEl.tabIndex = -1; }

function collide(){
  const {w,h} = stageSize();
  const zoom = view.s / fitScale;
  const placed = [];
  const order = WORDS.slice().sort((a,b) => (forced(b) - forced(a)) || (a.t - b.t) || (b.C - a.C));
  for (const wd of order){
    const onscreen = wd.sx > -240 && wd.sx < w + 240 && wd.sy > -120 && wd.sy < h + 120;
    const gate = forced(wd) || showAll || wd.t === 1 || (wd.t === 2 && zoom >= 1.15) || (wd.t === 3 && zoom >= 1.9);
    const filtered = hypOnly && !wd.tags.includes('hyperion');
    if (!onscreen || !gate || filtered){ hide(wd); continue; }
    if (showAll && !forced(wd)){ show(wd); placed.push(labelRect(wd, wd.pos)); continue; }
    let ok = false;
    for (const p of ['r','l','b','a']){
      const r = labelRect(wd, p);
      if (r.y < HDR_H + 6) continue;
      if (placed.some(q => overlap(r, q, 3))) continue;
      wd.pos = p; ok = true; placed.push(r); break;
    }
    if (ok) show(wd); else hide(wd);
  }
  WORDS.forEach(positionLabel);
}

/* ---------- pan and zoom ---------- */
function zoomAt(mx, my, k){
  const ns = clamp(view.s * k, fitScale * 0.5, fitScale * 40);
  k = ns / view.s;
  view.tx = mx - (mx - view.tx) * k; view.ty = my - (my - view.ty) * k; view.s = ns;
  requestRender();
}
function jumpTo(wd){
  const {w,h} = stageSize();
  const s = Math.max(view.s, fitScale * 2.6);
  view.s = s; view.tx = w/2 - wd.x * s; view.ty = h/2 - wd.y * s;
  requestRender();
}
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  if (e.shiftKey){ view.tx -= (e.deltaY || e.deltaX); requestRender(); return; }
  const k = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.06 : e.ctrlKey ? 0.012 : 0.0022));
  zoomAt(mx, my, k);
}, { passive: false });

const pointers = new Map();
let drag = null, pinch = null, suppressClickUntil = 0;
const dist = (a,b) => Math.hypot(a.x - b.x, a.y - b.y), mid = (a,b) => ({ x: (a.x+b.x)/2, y: (a.y+b.y)/2 });
stage.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1){ drag = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty, moved: false }; }
  else if (pointers.size === 2){
    drag = null; const [p1,p2] = [...pointers.values()];
    pinch = { d: dist(p1,p2), s: view.s, mid: mid(p1,p2), tx: view.tx, ty: view.ty };
  }
});
window.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2){
    const [p1,p2] = [...pointers.values()], r = stage.getBoundingClientRect(), m = mid(p1,p2);
    const ns = clamp(pinch.s * dist(p1,p2) / pinch.d, fitScale * 0.5, fitScale * 40), k = ns / pinch.s;
    view.s = ns;
    view.tx = (m.x - r.left) - ((pinch.mid.x - r.left) - pinch.tx) * k;
    view.ty = (m.y - r.top) - ((pinch.mid.y - r.top) - pinch.ty) * k;
    requestRender(); return;
  }
  if (drag){
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx,dy) > 4){ drag.moved = true; stage.classList.add('dragging'); }
    if (drag.moved){ view.tx = drag.tx + dx; view.ty = drag.ty + dy; requestRender(); }
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if (drag && drag.moved) suppressClickUntil = performance.now() + 250;
  drag = null; pinch = null; stage.classList.remove('dragging');
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

stage.addEventListener('keydown', e => {
  if (e.target !== stage) return;
  const {w,h} = stageSize(), step = 80;
  switch (e.key){
    case 'ArrowLeft': view.tx += step; break;
    case 'ArrowRight': view.tx -= step; break;
    case 'ArrowUp': view.ty += step; break;
    case 'ArrowDown': view.ty -= step; break;
    case '+': case '=': zoomAt(w/2, h/2, 1.3); e.preventDefault(); return;
    case '-': case '_': zoomAt(w/2, h/2, 1/1.3); e.preventDefault(); return;
    case '0': fitView(); e.preventDefault(); return;
    default: return;
  }
  e.preventDefault(); requestRender();
});
$('#zoomIn').addEventListener('click', () => { const {w,h} = stageSize(); zoomAt(w/2, h/2, 1.3); });
$('#zoomOut').addEventListener('click', () => { const {w,h} = stageSize(); zoomAt(w/2, h/2, 1/1.3); });
$('#resetBtn').addEventListener('click', fitView);
/* a small resize just redraws; a big one (phone rotation, panel collapse) refits */
let lastW = 0;
new ResizeObserver(() => {
  const w = stage.clientWidth;
  if (lastW && Math.abs(w - lastW) / lastW > 0.3) fitView(); else requestRender();
  lastW = w;
}).observe(stage);

/* ---------- the detail panel ---------- */
const panel = $('#panelBody');
const wikiCache = new Map();
function lsGet(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

/* A photo for a Wikipedia article: the pinned file when the object names one,
   otherwise the article's lead image. One request either way. Cached in memory
   and, for a month, in localStorage, so the second look at a word is instant. */
function wikiImage(title, file){
  const key = file ? 'cw:file:' + file + '|' + title : 'cw:wiki:' + title;
  if (wikiCache.has(key)) return Promise.resolve(wikiCache.get(key));
  const cached = lsGet(key);
  if (cached && cached.ts && Date.now() - cached.ts < 30 * 864e5){ wikiCache.set(key, cached); return Promise.resolve(cached); }
  const base = 'https://en.wikipedia.org/w/api.php?action=query&redirects=1&format=json&formatversion=2&origin=*';
  const url = file
    ? base + '&prop=imageinfo%7Cdescription&iiprop=url&iiurlwidth=720&titles=' + encodeURIComponent('File:' + file.replace(/^File:/, '') + '|' + title)
    : base + '&prop=pageimages%7Cdescription&piprop=thumbnail&pithumbsize=720&titles=' + encodeURIComponent(title);
  const p = fetch(url)
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(d => {
      const pages = (d && d.query && d.query.pages) || [];
      let res;
      if (file){
        const fp = pages.find(p => p.imageinfo && p.imageinfo[0]);
        const ap = pages.find(p => p !== fp) || null;
        res = { ts: Date.now(), title: (ap && ap.title) || title, missing: !ap || !!ap.missing,
                src: fp ? (fp.imageinfo[0].thumburl || fp.imageinfo[0].url) : null, desc: (ap && ap.description) || '' };
      } else {
        const page = pages[0];
        res = { ts: Date.now(), title: (page && page.title) || title, missing: !page || !!page.missing,
                src: page && page.thumbnail ? page.thumbnail.source : null, desc: (page && page.description) || '' };
      }
      lsSet(key, res); wikiCache.set(key, res); return res;
    })
    .catch(err => { wikiCache.delete(key); throw err; });
  wikiCache.set(key, p);
  return p;
}

function renderDefault(){
  const approx = WORDS.filter(w => w.approx).length;
  panel.innerHTML = `
    <div class="legend">
      <div class="eyebrow">Reading the map</div>
      <h2>Color words, by where they live</h2>
      <p><strong>Left to right is hue.</strong> Red through orange, yellow, green, blue and violet, then out to magenta. The circle is cut between aubergine and rose, so the pinks sit beside the reds.</p>
      <p><strong>Up and down is lightness.</strong> A word on the band is its hue at full strength. Above the band are the tints (peach, celadon, periwinkle). Below it are the shades (burgundy, umber, navy). The strip on the right holds the whites, grays and blacks.</p>
      <p><strong>Muted words</strong> like ochre, sage and glaucous sit at their hue, but their swatch is grayer than the band behind them. That gap is the word.</p>
      <p>Hover a word to preview it here. <strong>Click to pin</strong> it; <kbd>Esc</kbd> unpins. Scroll to zoom, drag to pan, <kbd>Shift</kbd> + scroll slides sideways. Zoom in and more words appear.</p>
      <p class="stat">${WORDS.length} words · ${approx} with approximate swatches · photos from Wikipedia, fetched when you look</p>
    </div>`;
}

let photoReq = 0;
function renderWord(w){
  const fam = w.family.toLowerCase();
  const where = w.isNeutral ? 'On the neutral strip'
    : w.dL > 0.06 ? 'Above the band: paler than pure ' + fam
    : w.dL < -0.06 ? 'Below the band: deeper than pure ' + fam
    : 'On the band: as light as pure ' + fam;
  const lch = 'L ' + Math.round(w.L * 100) + ' · C ' + w.C.toFixed(2) + (w.isNeutral ? '' : ' · hue ' + Math.round(w.hue) + '°');
  const chips = w.obj.map((o, i) => `<button type="button" class="chip" data-obj="${i}" aria-pressed="${i === 0 ? 'true' : 'false'}">${esc(o[0])}</button>`).join('');
  const nb = w.near.map(o => `<li><button type="button" data-jump="${o.id}"><span class="sq" style="--c:${o.hex}" aria-hidden="true"></span><span>${esc(o.n)}</span><span class="rel">${esc(relation(w, o))}</span></button></li>`).join('');
  const tags = w.tags.map(t => `<span class="badge">${esc(t)}</span>`).join('') + (w.found ? `<span class="cap">${esc(w.found)}</span>` : '');
  panel.innerHTML = `
    <div class="eyebrow">${esc(w.eyebrow)}</div>
    <h2>${esc(w.n)}</h2>
    <div class="swatch" style="--c:${w.hex}"><code>${w.hex}</code></div>
    <div class="meta"><span>${esc(where)}</span><span class="lch">${esc(lch)}</span></div>
    ${w.approx ? '<div class="approx">No conventional value exists for this word, so the swatch is a considered guess. Correct it in the file if you find a better one.</div>' : ''}
    <p class="def">${esc(w.def)}</p>
    <div class="sec">
      <div class="sec-h">Looks like</div>
      <div class="chips">${chips}</div>
      <div class="photo" id="photo">Loading photo…</div>
      <div class="cap" id="cap"></div>
    </div>
    <div class="sec"><div class="sec-h">Evokes</div><p>${esc(w.ev)}</p></div>
    <div class="sec"><div class="sec-h">Origin</div><p>${esc(w.or)}</p></div>
    <div class="sec"><div class="sec-h">Nearest neighbors</div><ul class="nb">${nb}</ul></div>
    ${tags ? `<div class="tags">${tags}</div>` : ''}`;
  panel.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => { const o = WORDS[+b.dataset.jump]; jumpTo(o); pin(o); }));
  panel.querySelectorAll('[data-obj]').forEach(b => b.addEventListener('click', () => {
    panel.querySelectorAll('[data-obj]').forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true'); loadPhoto(w, +b.dataset.obj);
  }));
  loadPhoto(w, 0);
}

async function loadPhoto(w, i){
  const req = ++photoReq;
  const box = $('#photo'), cap = $('#cap');
  if (!box) return;
  box.classList.remove('loaded'); box.textContent = 'Loading photo…'; cap.textContent = '';
  const order = [i].concat(w.obj.map((_, k) => k).filter(k => k !== i));
  for (const k of order){
    const [label, title, file] = w.obj[k];
    let res = null;
    if (file){ try { res = await wikiImage(title, file); } catch (err) { res = null; } }
    if (req !== photoReq) return;
    if (!res || !res.src){ try { res = await wikiImage(title); } catch (err) { res = null; } }
    if (req !== photoReq) return;
    if (!res || !res.src) continue;
    const img = new Image();
    img.alt = label + ', photo from Wikipedia';
    img.onload = () => { if (req !== photoReq) return; box.textContent = ''; box.append(img); box.classList.add('loaded'); };
    img.onerror = () => { if (req === photoReq) box.textContent = 'The photo did not load.'; };
    img.src = res.src;
    const href = 'https://en.wikipedia.org/wiki/' + encodeURIComponent(res.title.replace(/ /g, '_'));
    const note = k !== i ? `No photo on the ${esc(w.obj[i][0])} article, so this is ` : '';
    cap.innerHTML = `${note}${esc(label)}${res.desc ? ' · ' + esc(res.desc) : ''} · <a href="${href}" target="_blank" rel="noopener">Wikipedia</a>`;
    return;
  }
  box.textContent = navigator.onLine === false
    ? 'Offline. Photos come from Wikipedia and need a connection.'
    : 'No photo found on Wikipedia for these objects.';
}

/* ---------- hover previews, click pins ---------- */
function updatePanel(){ const w = hovered || pinned; if (w) renderWord(w); else renderDefault(); }
let hoverTimer = 0;
function setHovered(w){
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => { if (hovered !== w){ hovered = w; updatePanel(); } }, 110);
}
function pin(w){
  if (pinned){ pinned.lblEl.classList.remove('pinned'); pinned.lblEl.setAttribute('aria-pressed', 'false'); }
  pinned = w;
  if (w){ w.lblEl.classList.add('pinned'); w.lblEl.setAttribute('aria-pressed', 'true'); }
  hovered = null; updatePanel(); scheduleCollide();
}
layer.addEventListener('pointerover', e => { const t = e.target.closest('[data-id]'); if (t) setHovered(WORDS[+t.dataset.id]); });
/* A preview lingers after the pointer leaves, so the panel can be used. When a
   word is pinned, leaving the map returns the panel to it. */
stage.addEventListener('pointerleave', () => { if (pinned && hovered){ clearTimeout(hoverTimer); hovered = null; updatePanel(); } });
layer.addEventListener('focusin', e => { const t = e.target.closest('.lbl'); if (t){ clearTimeout(hoverTimer); hovered = WORDS[+t.dataset.id]; updatePanel(); } });
layer.addEventListener('click', e => {
  if (performance.now() < suppressClickUntil) return;
  const t = e.target.closest('.lbl'); if (!t) return;
  const w = WORDS[+t.dataset.id];
  pin(pinned === w ? null : w);
});
stage.addEventListener('click', e => {
  if (performance.now() < suppressClickUntil) return;
  if (!e.target.closest('.lbl, .dot, .zoomctl')) pin(null);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.activeElement !== $('#q')){ pin(null); }
});

/* ---------- search, filters ---------- */
const q = $('#q'), qCount = $('#qCount');
function applyDim(){
  WORDS.forEach(w => {
    const dim = (searching && !hits.has(w)) || (hypOnly && !w.tags.includes('hyperion'));
    w.lblEl.classList.toggle('dim', dim); w.dotEl.classList.toggle('dim', dim);
    w.lblEl.classList.toggle('hit', hits.has(w));
  });
}
function runSearch(){
  const term = q.value.trim().toLowerCase();
  hits = new Set(); searching = !!term;
  if (term) WORDS.forEach(w => {
    if (w.n.toLowerCase().includes(term) || w.def.toLowerCase().includes(term) || w.ev.toLowerCase().includes(term)
        || w.family.toLowerCase() === term || w.tags.includes(term)) hits.add(w);
  });
  qCount.textContent = searching ? hits.size + (hits.size === 1 ? ' hit' : ' hits') : '';
  applyDim(); scheduleCollide();
}
q.addEventListener('input', runSearch);
q.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ q.value = ''; runSearch(); stage.focus(); e.preventDefault(); }
  if (e.key === 'Enter'){
    const term = q.value.trim().toLowerCase();
    const ranked = WORDS.filter(w => hits.has(w)).sort((a, b) => {
      const ia = a.n.toLowerCase().indexOf(term), ib = b.n.toLowerCase().indexOf(term);
      return (ia < 0) - (ib < 0) || ia - ib || a.n.localeCompare(b.n);
    });
    if (ranked[0]){ jumpTo(ranked[0]); pin(ranked[0]); }
    e.preventDefault();
  }
});
const allBtn = $('#allBtn');
allBtn.addEventListener('click', () => { showAll = !showAll; allBtn.setAttribute('aria-pressed', String(showAll)); scheduleCollide(); });
const hypBtn = $('#hypBtn');
hypBtn.hidden = !WORDS.some(w => w.tags.includes('hyperion'));
hypBtn.addEventListener('click', () => { hypOnly = !hypOnly; hypBtn.setAttribute('aria-pressed', String(hypOnly)); applyDim(); scheduleCollide(); });

/* ---------- theme ---------- */
const root = document.documentElement, themeBtn = $('#themeBtn'), themeIcon = $('#themeIcon');
const SUN = '<circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';
const MOON = '<path d="M20 13.2A8.2 8.2 0 0 1 10.8 4a8.4 8.4 0 1 0 9.2 9.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>';
function applyTheme(t){
  root.setAttribute('data-theme', t);
  const dark = t === 'dark';
  themeBtn.setAttribute('aria-pressed', String(dark));
  themeBtn.querySelector('.sr-only').textContent = dark ? 'Dark theme' : 'Light theme';
  themeIcon.innerHTML = dark ? MOON : SUN;
  lsSet('cw:theme', t); requestRender();
}
themeBtn.addEventListener('click', () => applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
const savedTheme = lsGet('cw:theme');
if (savedTheme === 'light' || savedTheme === 'dark') applyTheme(savedTheme);

/* ---------- boot ---------- */
$('#countPill').textContent = WORDS.length + ' words';
renderDefault();
fitView();
window.chromatic = { words: WORDS, view, fit: fitView, jump: jumpTo, pin };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); requestRender(); });
window.addEventListener('load', () => { measure(); requestRender(); });
})();
</script>
</body>
</html>
